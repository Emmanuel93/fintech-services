spring:
  application:
    name: charges-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: ${POSTGRES_USER:fintech}
    password: ${POSTGRES_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: charges
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/charges/db.changelog-charges.xml
    default-schema: charges
    liquibase-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: charges-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8088
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fintech:
  charges:
    vat-rate: 0.16
    grace-period-days: 3
    moratorium-rate-multiplier: 1.5
    opening-fee-rate: 0
    prepayment-fee-rate: 0
    prepayment-free-months: 0
    admin-fee-enabled: false
  test-support:
    # Endpoints /internal/test-support/* — solo para pruebas E2E, deshabilitados por default.
    enabled: ${TEST_SUPPORT_ENABLED:false}
