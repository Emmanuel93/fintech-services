spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/charges/db.changelog-charges.xml

# EmbeddedKafka overrides this at runtime
spring.kafka.bootstrap-servers=localhost:9092

fintech.charges.jwt-secret=dGVzdC1zZWNyZXQtZm9yLWNoYXJnZXMtc2VydmljZS10ZXN0aW5nLW9ubHk=
fintech.charges.vat-rate=0.16
fintech.charges.grace-period-days=3
fintech.charges.moratorium-rate-multiplier=1.5
fintech.charges.opening-fee-rate=0.02

# Suppress banner in tests
spring.main.banner-mode=off
