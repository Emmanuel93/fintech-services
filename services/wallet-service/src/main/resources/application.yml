spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: ${POSTGRES_USER:fintech}
    password: ${POSTGRES_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: wallet
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/wallet/db.changelog-wallet.xml
    default-schema: wallet
    liquibase-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wallet-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8092
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fintech:
  wallet:
    stale-threshold-minutes: ${WALLET_STALE_THRESHOLD_MINUTES:30}
    codi-expiry-minutes: ${CODI_EXPIRY_MINUTES:10}
    spei-start-hour: ${SPEI_START_HOUR:7}
    spei-end-hour: ${SPEI_END_HOUR:23}
    spei-time-zone: ${SPEI_TIME_ZONE:America/Mexico_City}
