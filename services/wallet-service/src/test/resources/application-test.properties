spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/wallet/db.changelog-wallet.xml

# EmbeddedKafka overrides this at runtime
spring.kafka.bootstrap-servers=localhost:9092

fintech.wallet.stale-threshold-minutes=30
fintech.wallet.codi-expiry-minutes=10
fintech.wallet.spei-start-hour=7
fintech.wallet.spei-end-hour=23
fintech.wallet.spei-time-zone=America/Mexico_City

spring.main.banner-mode=off
