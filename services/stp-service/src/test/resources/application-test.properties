spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/stp/db.changelog-stp.xml

# EmbeddedKafka lo sobreescribe en runtime
spring.kafka.bootstrap-servers=localhost:9092
# Without a broker a send fails fast and the outbox message stays pending, instead of blocking the relay a minute.
spring.kafka.producer.properties.max.block.ms=1000

fintech.stp.gateway.mode=stub
fintech.stp.polling.enabled=false
# No test relies on the scheduled relay; left running, a cached context would race a test for its own messages.
fintech.stp.outbox.relay-interval=PT1H
fintech.stp.polling.interval=PT1S
fintech.stp.gateway.stub.settle-after=0s
fintech.stp.gateway.stub.latency=0s
fintech.stp.crypto.current-kek-id=test
fintech.stp.account-hash-salt=test-salt

# KEK de pruebas: 32 bytes en Base64. Nunca se usa fuera de test.
STP_KEK_TEST=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

spring.main.banner-mode=off
