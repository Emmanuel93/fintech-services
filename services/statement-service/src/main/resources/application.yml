spring:
  application:
    name: statement-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${POSTGRES_USER:fintech}
    password: ${POSTGRES_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Cada hilo consumidor usa una conexión a la vez y nunca durante el llenado del PDF.
      maximum-pool-size: ${DB_POOL_SIZE:8}

  liquibase:
    change-log: classpath:db/changelog/statement/db.changelog-statement.xml
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # El grupo: cada pod toma las particiones que le tocan de closing.cutoff-closed.
      group-id: ${KAFKA_GROUP_ID:statement-service}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8106}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

fintech:
  # Test support (shiftable business clock, among others). Off unless TEST_SUPPORT_ENABLED=true; never in production.
  test-support:
    enabled: ${TEST_SUPPORT_ENABLED:false}
  statement:
    node-id: ${HOSTNAME:local}
    # Techo de paralelismo entre todos los pods: Kafka da cada partición a un solo consumidor.
    partitions: ${STATEMENT_PARTITIONS:12}
    # Hilos por pod; cada uno llena y exporta un PDF a la vez.
    concurrency: ${STATEMENT_CONCURRENCY:4}
    max-attempts: 5
    stale-after: 10m
    retry:
      enabled: true
      interval: PT2M
    # Una plantilla por producto: src/main/resources/reports/estado-cuenta-<producto>.jrxml (ver StatementTemplate).
    issuer:
      name: ${STATEMENT_ISSUER_NAME:Kredius}
      # What a SOFOM ENR statement prints about its issuer (CONDUSEF DT-ENR art. 35). Address and phones must be the
      # company's own: until they are set they print "por configurar".
      legal-name: ${STATEMENT_ISSUER_LEGAL_NAME:Fintech Services, S.A. de C.V., SOFOM, E.N.R.}
      rfc: ${STATEMENT_ISSUER_RFC:FSE200101AB1}
      address: ${STATEMENT_ISSUER_ADDRESS:domicilio por configurar}
      phone: ${STATEMENT_ISSUER_PHONE:teléfono por configurar}
      website: ${STATEMENT_ISSUER_WEBSITE:la app Kredius}
      une-address: ${STATEMENT_ISSUER_UNE_ADDRESS:domicilio de la UNE por configurar}
      une-email: ${STATEMENT_ISSUER_UNE_EMAIL:une@kredius.mx}
      une-phone: ${STATEMENT_ISSUER_UNE_PHONE:teléfono de la UNE por configurar}
      condusef-website: ${STATEMENT_CONDUSEF_WEBSITE:www.condusef.gob.mx}
      condusef-phone: ${STATEMENT_CONDUSEF_PHONE:55 5340 0999}
    # Marca del documento. Los valores por omisión son el design system de Kredius; las plantillas están
    # escritas con ellos y el servicio los sustituye al compilar (JasperStatementRenderer).
    branding:
      logo: ${STATEMENT_BRANDING_LOGO:classpath:branding/kredius-logotipo-azul.png}
      palette:
        primary: ${STATEMENT_BRANDING_PRIMARY:#0D47A1}
        accent: ${STATEMENT_BRANDING_ACCENT:#00B894}
        ink: ${STATEMENT_BRANDING_INK:#0F1A2E}
        muted: ${STATEMENT_BRANDING_MUTED:#7A8296}
        paper: ${STATEMENT_BRANDING_PAPER:#EBF0F7}
        soft: ${STATEMENT_BRANDING_SOFT:#F6F8FC}
        line: ${STATEMENT_BRANDING_LINE:#EDEFF3}
        primary-container: ${STATEMENT_BRANDING_PRIMARY_CONTAINER:#D6E4FF}
        on-primary-container: ${STATEMENT_BRANDING_ON_PRIMARY_CONTAINER:#001A42}
    clients:
      credit-portfolio-url: ${CREDIT_PORTFOLIO_URL:http://localhost:8087}
      party-url: ${PARTY_URL:http://localhost:8083}
      commission-url: ${COMMISSION_URL:http://localhost:8097}
      timeout: PT10S
  scheduling:
    lock:
      table: statement.shedlock
