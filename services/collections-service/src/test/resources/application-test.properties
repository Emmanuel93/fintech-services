spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/collections/db.changelog-collections.xml

# EmbeddedKafka overrides this at runtime
spring.kafka.bootstrap-servers=localhost:9092

# Deterministic contact window for acceptance tests (avoid CT-02 flakiness by wall clock)
fintech.collections.contact-allowed-hours-start=0
fintech.collections.contact-allowed-hours-end=24

# Suppress banner in tests
spring.main.banner-mode=off
