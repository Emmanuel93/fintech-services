# gateway-service/nginx.conf — API Gateway con validación JWT RS256 + Rate Limiting (OpenResty)
#
# REGLA CENTRAL: toda request a cualquier microservicio debe estar autenticada.
# identity-service es el ÚNICO firmante de tokens en todo el ecosistema.
# El gateway valida la firma localmente con la llave pública RSA (sin llamar a identity).
# Sin token válido → 401; la request NUNCA alcanza el microservicio.
#
# Routing por subdominio — cada BFF tiene su propio server block:
#   mobile.fintech-service      →  channel-mobile-service:8085
#   backoffice.fintech-service  →  channel-backoffice-service:8099  (exige channel=BACKOFFICE)
#
# El claim `channel` del JWT separa las puertas: un token de la app de cliente es válido
# —misma firma, mismo emisor— pero no abre el backoffice, y viceversa.
#
# Los domain services (identity, origination, party, scoring, etc.) NO son accesibles
# desde internet. Solo los BFF los llaman internamente por nombre de contenedor.
#
# Endpoints PÚBLICOS (pre-registro: el usuario aún no tiene cuenta) con rate limit:
#   POST /auth/login      → 5 req/min  burst 2  (brute force de PIN)
#   POST /auth/refresh    → 10 req/min burst 5  (rotación de tokens)
#   POST /auth/register   → 3 req/min  burst 1  (flood de cuentas)
#   POST /otp/send        → 3 req/min  burst 1  (SMS = costo real)
#   POST /otp/verify      → 10 req/min burst 3  (intentos de código)
#   POST /otp/resend      → 3 req/min  burst 1  (comparte rl_otp_send)
#   POST /ocr/extract     → 5 req/min  burst 2  (extracción INE por sesión)
#   POST /kyc/submit      → 3 req/min  burst 1  (envío de datos KYC)
#
# Backoffice (subdominio backoffice.*):
#   POST /auth/staff/login   → 5 req/min  burst 2  (brute force contra cuentas con poder)
#   POST /auth/staff/refresh → 20 req/min burst 5  (rotación de sesión de consola)

worker_processes auto;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # ── Lua ──────────────────────────────────────────────────────────────────
    lua_package_path "/etc/nginx/conf.d/?.lua;;";

    # ── OpenTelemetry tracing (fail-open) ─────────────────────────────────────
    # DNS de Docker para que el export OTLP resuelva "otel-collector".
    resolver 127.0.0.11 ipv6=off;
    # Fases a nivel http → aplican a TODAS las rutas de ambos server blocks:
    #   rewrite → abre span + propaga W3C traceparent al upstream (antes del proxy y del JWT)
    #   log     → cierra span y lo exporta async (ngx.timer) al collector
    rewrite_by_lua_block { require("otel").start() }
    log_by_lua_block     { require("otel").finish() }

    # ── Rate Limit Zones ──────────────────────────────────────────────────────
    # Las zonas viven en un archivo aparte para que local pueda relajarlas sin
    # tocar los límites reales: se monta `rate-limits.conf` (producción) o
    # `rate-limits.local.conf` según GATEWAY_RATE_LIMITS.
    include /etc/nginx/rate-limits.conf;

    limit_req_status   429;
    limit_req_log_level warn;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    # Solo los BFF son upstreams del gateway. Los domain services no aparecen aquí —
    # no son accesibles desde internet; los BFF los llaman por red Docker interna.

    # channel-mobile-service corre en 8085 (no en 8080 como los domain services)
    upstream mobile_upstream {
        server channel-mobile-service:8085;
        keepalive 16;
    }

    # channel-backoffice-service corre en 8099 (8086 ya es de configuration-service),
    # igual que el BFF móvil no usa 8080 para no chocar con los domain services.
    upstream backoffice_upstream {
        server channel-backoffice-service:8099;
        keepalive 16;
    }

    # ── CORS del backoffice ───────────────────────────────────────────────────
    # El backoffice es una SPA servida desde otro origen (Vite en :4200 durante
    # desarrollo), así que sus llamadas son cross-origin y el navegador exige CORS.
    # Lista blanca explícita: nunca "*", porque las peticiones llevan Authorization.
    map $http_origin $cors_origin {
        default                       "";
        "~^http://localhost:4200$"    $http_origin;
        "~^http://127\.0\.0\.1:4200$" $http_origin;
        # El backoffice es una federación de módulos: el shell corre en 4200 y
        # cada remote en su propio puerto (5101-5104). Cuando un módulo pide
        # datos, el origen es el del shell, pero al abrirlo suelto para
        # depurarlo el origen es el suyo — y sin esto la llamada muere en CORS.
        "~^http://localhost:51[0-9][0-9]$"    $http_origin;
        "~^http://127\.0\.0\.1:51[0-9][0-9]$" $http_origin;
    }

    # ── Formato de log JSON (auditoría) ──────────────────────────────────────
    # Campos de auditoría:
    #   request_id    → correlación entre gateway y downstream logs
    #   source_ip     → IP real del cliente (origen de la petición)
    #   auth_required → "true" = ruta protegida con JWT / "false" = ruta pública
    #   user_id       → sub del JWT validado (vacío en rutas públicas)
    #   bytes_sent    → tamaño de la respuesta (para detectar fugas de datos)
    #   user_agent    → identificación del cliente (app móvil, browser, bot, etc.)
    log_format gateway_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"source_ip":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$query_string",'
        '"user_agent":"$http_user_agent",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"upstream":"$upstream_addr",'
        '"user_id":"$http_x_user_id",'
        '"auth_required":"$auth_required",'
        '"duration_ms":$request_time,'
        '"limit_req_status":"$limit_req_status"'
        '}';

    access_log /dev/stdout gateway_json;

    # ── Cabeceras de seguridad (aplicadas en todos los server blocks) ─────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;

    # ══════════════════════════════════════════════════════════════════════════
    # BFF MÓVIL — mobile.fintech-service
    # channel-mobile-service agrega lógica de presentación y orquesta llamadas
    # a identity, origination, party, etc. por red Docker interna.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name mobile.localhost mobile.fintech-service;

        # Auditoría: por defecto toda ruta requiere auth.
        # Las rutas públicas sobreescriben a "false" en su propio bloque.
        set $auth_required "true";

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Respuesta 429 con Retry-After
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"error":"rate_limited","reason":"too many requests — please retry after 60 seconds"}';
        }

        # ── Rutas PÚBLICAS — sin JWT, con rate limit ──────────────────────────

        location = /auth/login {
            set $auth_required "false";
            limit_req zone=rl_login burst=2 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        location = /auth/refresh {
            set $auth_required "false";
            limit_req zone=rl_refresh burst=5 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        location = /auth/register {
            set $auth_required "false";
            limit_req zone=rl_register burst=1 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        location = /otp/send {
            set $auth_required "false";
            limit_req zone=rl_otp_send burst=1 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        location = /otp/verify {
            set $auth_required "false";
            limit_req zone=rl_otp_verify burst=3 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        location = /otp/resend {
            set $auth_required "false";
            limit_req zone=rl_otp_send burst=1 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        # Onboarding pre-registro: el usuario no tiene cuenta aún, no hay JWT.
        # Protección: rate limit + UUID de folioKyc unguessable.
        location = /ocr/extract {
            set $auth_required "false";
            limit_req zone=rl_ocr burst=2 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        location = /kyc/submit {
            set $auth_required "false";
            limit_req zone=rl_kyc burst=1 nodelay;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_pass http://mobile_upstream;
        }

        # ── Rutas PROTEGIDAS — JWT RS256 requerido ────────────────────────────
        # Cubre: /auth/logout, /credit/products, /credit/applications, /credit/applications/{id}
        location / {
            access_by_lua_block { require("jwt").validate() }
            proxy_pass http://mobile_upstream;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # BFF BACKOFFICE — backoffice.localhost
    # channel-backoffice-service agrega y orquesta llamadas a los servicios de
    # dominio por red Docker interna. La diferencia con el bloque móvil no es solo
    # el upstream: aquí el JWT tiene que traer channel=BACKOFFICE, así que un token
    # de la app de cliente —firmado por el mismo emisor y perfectamente válido—
    # no abre esta puerta.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name backoffice.localhost backoffice.fintech-service;

        set $auth_required "true";

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # Las agregaciones del dashboard hacen fan-out a varios servicios; 60s del
        # bloque móvil se queda corto en el peor caso.
        proxy_read_timeout    90s;

        error_page 429 @bo_rate_limited;
        location @bo_rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            return 429 '{"error":"rate_limited","reason":"too many requests — please retry after 60 seconds"}';
        }

        # ── Rutas PÚBLICAS — sin JWT, con rate limit ──────────────────────────
        #
        # Nota sobre CORS: los add_header van repetidos dentro de cada bloque, incluido
        # el `if` del preflight. nginx solo hereda add_header del nivel anterior cuando
        # el nivel actual no declara ninguno, así que factorizarlos al server los haría
        # desaparecer justo donde importa. Repetirlos es feo pero es lo que se comporta.

        location = /auth/staff/login {
            set $auth_required "false";

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
                add_header Access-Control-Allow-Methods "POST,OPTIONS" always;
                add_header Access-Control-Max-Age       600 always;
                add_header Content-Length 0;
                return 204;
            }

            limit_req zone=rl_staff_login burst=2 nodelay;

            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Methods "POST,OPTIONS" always;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_set_header X-Channel         "";
            proxy_pass http://backoffice_upstream;
        }

        location = /auth/staff/refresh {
            set $auth_required "false";

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
                add_header Access-Control-Allow-Methods "POST,OPTIONS" always;
                add_header Access-Control-Max-Age       600 always;
                add_header Content-Length 0;
                return 204;
            }

            limit_req zone=rl_staff_refresh burst=5 nodelay;

            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Methods "POST,OPTIONS" always;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id         "";
            proxy_set_header X-Roles           "";
            proxy_set_header X-Channel         "";
            proxy_pass http://backoffice_upstream;
        }

        # ── Rutas PROTEGIDAS — JWT RS256 + channel=BACKOFFICE ─────────────────
        location / {
            # El preflight se responde en el borde: OPTIONS no lleva Authorization,
            # así que pasarlo por el validador lo rompería siempre.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_origin always;
                add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
                add_header Access-Control-Max-Age       600 always;
                add_header Content-Length 0;
                return 204;
            }

            access_by_lua_block { require("jwt").validate("BACKOFFICE") }

            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;

            proxy_pass http://backoffice_upstream;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    # DEFAULT — health check + DENY BY DEFAULT
    # Cualquier host no reconocido cae aquí. Los domain services solo son
    # accesibles internamente (Docker network), nunca desde este bloque.
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        server_name _;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"fintech-gateway"}';
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","reason":"no route matches the requested host or path"}';
        }
    }
}
