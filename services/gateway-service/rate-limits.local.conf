# ── Rate Limit Zones — SÓLO DESARROLLO LOCAL ─────────────────────────────────
#
# Mismas zonas que `rate-limits.conf` con límites holgados. Existe por una
# razón concreta: la suite E2E de la app da de alta un prospecto por caso, y
# con 3 registros por minuto la tercera corrida seguida recibe 429 y la prueba
# falla por el gateway, no por el producto.
#
# 6000r/m ≈ 100 req/s: por encima de cualquier ráfaga de la suite, y por encima
# también del `burst=1` que cada ubicación define en nginx.conf — ese burst se
# queda como está porque es la protección real y no se toca por entorno.
#
# **No usar fuera de local.** Los límites reales viven en `rate-limits.conf` y
# son los que se montan por default; esta variante sólo entra si se define
# GATEWAY_RATE_LIMITS=rate-limits.local.conf, que vive en el .env local
# (gitignoreado).

limit_req_zone $binary_remote_addr zone=rl_login:10m      rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_refresh:10m    rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_register:10m   rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_otp_send:10m   rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_otp_verify:10m rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_ocr:10m        rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_kyc:10m        rate=6000r/m;

limit_req_zone $binary_remote_addr zone=rl_staff_login:10m   rate=6000r/m;
limit_req_zone $binary_remote_addr zone=rl_staff_refresh:10m rate=6000r/m;
