# ── Rate Limit Zones (ngx_http_limit_req_module) ─────────────────────────────
#
# Valores de producción. Clave: IP binaria (~6B). 10m ≈ 160K IPs por zona.
# nodelay en los `limit_req`: el excedente de burst devuelve 429 inmediato.
#
# Para local hay una variante relajada en `rate-limits.local.conf`, que se
# monta con GATEWAY_RATE_LIMITS. Los nombres de zona deben coincidir entre las
# dos: los `limit_req` de nginx.conf los referencian por nombre.

limit_req_zone $binary_remote_addr zone=rl_login:10m      rate=5r/m;
limit_req_zone $binary_remote_addr zone=rl_refresh:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_register:10m   rate=3r/m;
limit_req_zone $binary_remote_addr zone=rl_otp_send:10m   rate=3r/m;
limit_req_zone $binary_remote_addr zone=rl_otp_verify:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rl_ocr:10m        rate=5r/m;
limit_req_zone $binary_remote_addr zone=rl_kyc:10m        rate=3r/m;

# Backoffice: el login de staff es el objetivo más goloso del sistema (una cuenta ADMIN ve
# toda la cartera), así que va más apretado que el login de cliente.
limit_req_zone $binary_remote_addr zone=rl_staff_login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=rl_staff_refresh:10m rate=20r/m;
