# Backend local a disco — apropiado para dev/demo, igual que el resto del stack no usa
# storage administrado (S3/GCS). Retención corta porque es un entorno de desarrollo, no producción.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h   # suficiente para un entorno de dev/demo — ajustar si se necesita más historia

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

query_frontend:
  search:
    duration_slo: 5s

# ── metrics_generator: alimenta el "service graph" (mapa de dependencias estilo Datadog) ──
# Genera métricas RED por par cliente→servidor (traces_service_graph_*) y por span
# (traces_spanmetrics_*) a partir de las trazas, y las escribe a Prometheus vía remote_write.
# Los nodos virtuales hacia backends NO instrumentados (Postgres, Redis, Kafka) los crea
# `peer_attributes`, NO `dimensions` (éstos solo agregan labels a la métrica). Tempo toma el
# primer peer_attribute presente en un span cliente sin par servidor y lo usa como nodo peer.
# Ver docs/dominios/T7_observability.md (OBS-05).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions: [db.system, messaging.system, messaging.destination.name]
      # crea los nodos virtuales: el primer atributo presente da el nombre del nodo peer.
      # hostname-first para nombrar por host del backend (consistente con los nodos ya existentes):
      #   server.address / net.peer.name → "postgres" / "redis" / "kafka"
      #   db.system / messaging.system   → fallback (postgresql / redis / kafka) si falta el host
      peer_attributes: [server.address, net.peer.name, db.system, messaging.system, peer.service]

# Habilita el generator globalmente (single-tenant / dev). Solo `service-graphs`:
# alimenta el mapa de dependencias (traces_service_graph_*). NO se activa `span-metrics`
# porque ningún panel consume traces_spanmetrics_* — el RED por endpoint viene de
# Micrometer (http_server_requests_*), evitando duplicar señal (OBS-01) y el costo de RAM
# de una métrica de alta cardinalidad sin consumidor.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
