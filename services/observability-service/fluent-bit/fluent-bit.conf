[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Tail de TODOS los contenedores Docker (json-file driver) — no hace falta que cada
# servicio monte un volumen de log propio, ninguno de los 19 escribe a archivo hoy.
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          source_path
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

# El campo "log" (línea de la app) es en sí mismo JSON (LogstashEncoder) — se
# vuelve a parsear y sus campos se fusionan al registro. No hace falta un filtro
# de metadata de Docker para resolver el nombre del servicio (Fluent Bit no trae
# un filtro "docker_metadata" nativo, a diferencia del filtro "kubernetes" para
# k8s) — el nombre real ya viaja en el propio JSON de la app como "service_name"
# (customFields en shared/logback-base.xml), así que se resuelve en origen, no acá.
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        app_json
    Reserve_Data  On

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    Index               fintech-logs
    Logstash_Format     On
    Logstash_Prefix     fintech-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Retry_Limit         5
