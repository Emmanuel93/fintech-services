# docker: parsea el wrapper JSON que pone el log driver json-file de Docker
# ({"log":"...","stream":"stdout","time":"..."}) — deja el contenido real de la
# línea de la app en el campo "log".
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

# app_json: parsea el campo "log" (ya extraído por el parser docker) como el JSON
# estructurado que emite LogstashEncoder en cada uno de los 19 servicios —
# incluye trace_id/span_id (inyectados por el agente de OTel vía MDC) sin config extra.
[PARSER]
    Name        app_json
    Format      json
    Time_Key    "@timestamp"
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
