apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Mapa de servicios (node graph) alimentado por las métricas traces_service_graph_* que
      # Tempo escribe a Prometheus vía remote_write. Habilita la pestaña "Service Graph".
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      # Salto traza→métricas (RED del span) y traza→logs (por trace_id).
      tracesToMetrics:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: elasticsearch
        filterByTraceID: true
        customQuery: false

  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "fintech-logs-*"
    editable: false
    jsonData:
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: level
