# Scrape estático de los 19 servicios Java — docker-compose no tiene service discovery
# nativo (a diferencia de Kubernetes), así que la lista vive acá, mecánica y explícita.
# `job_name` = nombre del servicio → es la label que usa el dashboard ($service).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["identity-service:8080"]

  - job_name: configuration-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["configuration-service:8080"]

