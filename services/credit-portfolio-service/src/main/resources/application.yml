spring:
  application:
    name: credit-portfolio-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${SPRING_DATASOURCE_USERNAME:fintech}
    password: ${SPRING_DATASOURCE_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:credit-portfolio-service}
      auto-offset-reset: earliest

  liquibase:
    change-log: classpath:db/changelog/creditportfolio/db.changelog-creditportfolio.yaml
    enabled: true

server:
  port: ${SERVER_PORT:8087}   # local: 8087 | docker: overridden to 8080 via SERVER_PORT
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

fintech:
  # Candado de crones: la tabla vive en el esquema del servicio (ver SchedulingLockAutoConfiguration).
  scheduling:
    lock:
      table: credit_portfolio.shedlock
  credit-portfolio:
    reminder-lead-days: ${CREDIT_PORTFOLIO_REMINDER_LEAD_DAYS:3}
  # El cierre del día D lo dispara charges.day-accrued (pasadas las 00:05 de D+1): mora al D+1, cuotas
  # y el aviso credit-portfolio.day-closed. Sólo si sus compuertas abren (ver DayCloseRunner); si no,
  # la reanudación lo vuelve a intentar cada 15 minutos. Nunca cierra un día que cargos no avisó.
  day-close:
    retry-cron: ${CREDIT_PORTFOLIO_DAY_CLOSE_RETRY_CRON:0 10/15 * * * *}
    # A RUNNING close older than this was interrupted (a restart): the retry job takes it over.
    stale-after: ${CREDIT_PORTFOLIO_DAY_CLOSE_STALE_AFTER:PT2H}
    # Cuánto espera en línea a que cartera consuma los cargos del día antes de dejarlo para la reanudación.
    gate-wait: PT10M
    gate-poll: PT2S
    # Sólo en pruebas: deja tomar la foto y cerrar un día que no ha terminado.
    allow-future-dates: ${TEST_SUPPORT_ENABLED:false}
  test-support:
    # Endpoints /internal/test-support/* — solo para pruebas E2E, deshabilitados por default.
    enabled: ${TEST_SUPPORT_ENABLED:false}

credit-portfolio:
  disbursement:
    retry:
      # D63 · a disbursement that fails for a technical or configuration reason (the link, an order STP never
      # registered, a route or a company missing) is asked again: this many attempts in all, each a new order with the
      # same instruction, the second after the first wait, the third after the second. A rule of the bank, an impossible
      # instruction or the attempts used up compensate at once. An hour, then six: the borrower knows the same day
      # whether the money arrives. A whole day fell on the same moment of the next one, the E2E's night move included.
      max-attempts: ${PORTFOLIO_DISBURSEMENT_MAX_ATTEMPTS:3}
      waits: ${PORTFOLIO_DISBURSEMENT_RETRY_WAITS:PT1H,PT6H}
