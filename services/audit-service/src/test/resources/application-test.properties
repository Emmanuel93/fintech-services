spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/audit/db.changelog-audit.xml

# EmbeddedKafka overrides this at runtime
spring.kafka.bootstrap-servers=localhost:9092

# Suppress banner in tests
spring.main.banner-mode=off
