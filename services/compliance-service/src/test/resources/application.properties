# Las pruebas son un ambiente bajo: los simuladores (listas de gobierno) arrancan.
fintech.environment=test

# Las pruebas no levantan broker: publicar tiene que fallar rápido, no esperar 60 s por envío al Kafka que
# no está (el publicador atrapa la falla: el veredicto guardado es la fuente). Con el stack apagado, la suite
# se quedaba más de 40 minutos esperando metadatos. Un puerto sin nadie, para no publicar al Kafka local
# cuando sí está arriba.
spring.kafka.bootstrap-servers=localhost:59092
spring.kafka.producer.properties.max.block.ms=1000
