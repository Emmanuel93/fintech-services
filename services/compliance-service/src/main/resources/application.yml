spring:
  application:
    name: compliance-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${SPRING_DATASOURCE_USERNAME:fintech}
    password: ${SPRING_DATASOURCE_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:compliance-service}
      auto-offset-reset: earliest
    producer:
      # Los veredictos se publican como JSON. Sin estas dos líneas el productor usaba el
      # StringSerializer por defecto y TODA publicación fallaba con SerializationException — que
      # el publicador registra y no relanza, así que el dictamen se guardaba aquí y nunca llegaba
      # a party ni a credit-portfolio: firmado y sin efecto. Las pruebas no lo veían porque no hay
      # Kafka en ellas; lo destapó la primera corrida en Docker.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Mismo contrato que los demás productores del monorepo: el consumidor declara su propio
        # payload y no debe depender de una clase de este servicio.
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 30000

  liquibase:
    change-log: classpath:db/changelog/compliance/db.changelog-compliance.xml
    enabled: true

server:
  port: ${SERVER_PORT:8105}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

fintech:
  # Candado de crones: la tabla vive en el esquema del servicio (ver SchedulingLockAutoConfiguration).
  scheduling:
    lock:
      table: compliance.shedlock
  compliance:
    # Cada lista con su cadencia. Se declara aquí y no se descubre: una lista que deja de
    # sincronizarse sin que nadie lo note es un control apagado que parece encendido.
    # Sincronización de listas: al arrancar y cada madrugada, ANTES del re-cruce de las 03:00 para
    # que el re-cruce mire la lista del día. La carga es idempotente por hash: correrla de más no
    # carga nada dos veces.
    watchlist-sync:
      enabled: ${COMPLIANCE_WATCHLIST_SYNC_ENABLED:true}
      on-startup: ${COMPLIANCE_WATCHLIST_SYNC_ON_STARTUP:true}
      cron: ${COMPLIANCE_WATCHLIST_SYNC_CRON:0 30 2 * * *}
    # De dónde llegan las listas. `mock` (por defecto) sólo arranca en ambientes bajos; `http` las
    # descarga del proveedor declarado aquí. Conectar uno (QeQ, el CSV de OFAC, la 69-B del SAT) es
    # llenar sus fuentes: URL con {date}, credencial del ambiente y layout del archivo.
    # PENDIENTE: QeQ entrega los archivos por SFTP, no por HTTP. Falta un adaptador SFTP sobre el
    # mismo puerto (GovernmentListPort: bytes + layout); el parser y la carga ya existen.
    #
    #   provider:
    #     mode: http
    #     name: QeQ
    #     sources:
    #       PEP-MX:
    #         url: https://<proveedor>/listas/pep?fecha={date}
    #         auth-header: Authorization
    #         auth-value: ${COMPLIANCE_LISTS_PROVIDER_TOKEN}
    #         delimiter: ","
    #         charset: UTF-8
    #         columns: { name: NOMBRE, curp: CURP, rfc: RFC, dateOfBirth: FECHA_NAC, program: CARGO }
    #         date-patterns: [ "yyyy-MM-dd", "dd/MM/yyyy" ]
    provider:
      mode: ${COMPLIANCE_LISTS_PROVIDER_MODE:mock}
      name: ${COMPLIANCE_LISTS_PROVIDER_NAME:proveedor-http}
      connect-timeout: ${COMPLIANCE_LISTS_CONNECT_TIMEOUT:5s}
      read-timeout: ${COMPLIANCE_LISTS_READ_TIMEOUT:60s}

    watchlists:
      - source-code: OFAC-SDN
        kind: SANCTIONS
      - source-code: PEP-MX
        kind: PEP
      - source-code: SAT-69B
        kind: TAX_BLACKLIST

    # El re-cruce corre en ventana de mantenimiento. La zona se declara: «las tres» tiene que ser
    # las tres donde está la operación, no donde está el contenedor.
    rescreen:
      enabled: ${COMPLIANCE_RESCREEN_ENABLED:true}
      cron: ${COMPLIANCE_RESCREEN_CRON:0 0 3 * * *}

    screening:
      # El umbral de parecido: demasiado bajo bloquea a media cartera por homonimia, demasiado alto
      # vuelve decorativo el control. Se configura porque se calibra con datos reales.
      min-similarity: ${COMPLIANCE_MIN_SIMILARITY:0.85}
