spring:
  application:
    name: disbursement-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: ${POSTGRES_USER:fintech}
    password: ${POSTGRES_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: disbursement
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/disbursement/db.changelog-disbursement.xml
    default-schema: disbursement
    # Crítico: la tabla de control va en public. Sin esto, el primer arranque falla porque
    # Liquibase intenta crear DATABASECHANGELOG en un schema que aún no existe.
    liquibase-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: disbursement-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8100}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fintech:
  test-support:
    # /internal/test-support/* (scheduling state, rest): only for the E2E, off by default.
    enabled: ${TEST_SUPPORT_ENABLED:false}
  disbursement:
    # Tesorería decide por dónde sale cada pago (BK-10). Si no responde, la orden
    # espera sin gastar intento: una caída de minutos no debe marcar órdenes como fallidas.
    banking:
      base-url: ${BANKING_BASE_URL:http://localhost:8104}
      unavailable-backoff: 30s
    dispatch:
      enabled: ${DISBURSEMENT_DISPATCH_ENABLED:true}
      # ISO-8601 obligatorio: este valor lo lee @Scheduled, que no entiende "5s".
      interval: PT5S
      batch-size: 50
      max-attempts: 6
      retry-backoff: PT15S

    rails:
      SPEI:
        enabled: true
        # Open around the clock: the cutoff is the connector's. STP holds an order registered around it and dates it
        # with the next business day (SpeiOperatingDay, `fintech.stp.spei.cutoff`), so the rule lives in one place.
        # The band this window closed (16:50-17:10) was a second cutoff, an hour off the connector's (D66).
        window:
          start: "00:00"
          end: "00:00"
          zone: America/Mexico_City
          days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY
      INTERNAL:
        enabled: true
        # start == end significa 24 h.
        window:
          start: "00:00"
          end: "00:00"
          zone: America/Mexico_City
          days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY

    topics:
      # Un topic por proveedor. Añadir uno es una entrada aquí y una fila en routing_rules.
      provider:
        STP: ${DISBURSEMENT_STP_TOPIC:disbursement.stp-requested}

      # Entradas ACL. Configurables para que un comprador use su propia nomenclatura.
      inbound:
        credit-account-activated: ${DISBURSEMENT_TOPIC_CREDIT_ACTIVATED:credit-portfolio.credit-account-activated}
        disposition-authorized: ${DISBURSEMENT_TOPIC_DISPOSITION_AUTHORIZED:credit-portfolio.disposition-authorized}
        wallet-withdrawal-completed: ${DISBURSEMENT_TOPIC_WALLET_WITHDRAWAL:wallet.withdrawal-completed}
        commission-lot-payout-requested: ${DISBURSEMENT_TOPIC_COMMISSION_LOT:commission.lot-payout-requested}

      # Resultados que reportan los conectores.
      provider-outcomes:
        accepted: ${DISBURSEMENT_TOPIC_PROVIDER_ACCEPTED:stp.order-accepted}
        settled: ${DISBURSEMENT_TOPIC_PROVIDER_SETTLED:stp.order-settled}
        rejected: ${DISBURSEMENT_TOPIC_PROVIDER_REJECTED:stp.order-rejected}
        returned: ${DISBURSEMENT_TOPIC_PROVIDER_RETURNED:stp.order-returned}

      # Hechos que publica este servicio.
      accepted: disbursement.accepted
      completed: disbursement.completed
      failed: disbursement.failed
      returned: disbursement.returned
