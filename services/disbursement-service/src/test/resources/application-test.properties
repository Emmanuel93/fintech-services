spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/disbursement/db.changelog-disbursement.xml

# EmbeddedKafka lo sobreescribe en runtime
spring.kafka.bootstrap-servers=localhost:9092

# El job no corre solo en pruebas: cada caso dispara el despacho cuando le toca.
fintech.disbursement.dispatch.enabled=false
fintech.disbursement.dispatch.interval=PT1S
fintech.disbursement.dispatch.max-attempts=3
fintech.disbursement.dispatch.retry-backoff=PT1S

fintech.disbursement.topics.provider.STP=disbursement.stp-requested

spring.main.banner-mode=off
