spring:
  application:
    name: banking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${SPRING_DATASOURCE_USERNAME:fintech}
    password: ${SPRING_DATASOURCE_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:banking-service}
      auto-offset-reset: earliest
    producer:
      # Sin estos dos, Kafka usa StringSerializer y cada evento (un record) revienta al enviarse:
      # la publicación fallaba siempre y las pruebas no lo veían porque sustituyen el publicador.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Los consumidores fijan su tipo local (USE_TYPE_INFO_HEADERS=false): la cabecera sólo filtraría
        # nombres de clases de este servicio.
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 30000

  liquibase:
    change-log: classpath:db/changelog/banking/db.changelog-banking.xml
    enabled: true

server:
  port: ${SERVER_PORT:8104}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

fintech:
  test-support:
    # /internal/test-support/* (scheduling state, rest): only for the E2E, off by default.
    enabled: ${TEST_SUPPORT_ENABLED:false}
  lock:
    enabled: true
    provider: redisson
    flavor: standard
    # La ventana en la que una petición repetida se descarta por ser la misma.
    default-ttl: 30s
    # Cero: el que no gana el candado pasa a la siguiente unidad en vez de bloquear un hilo.
    wait-time: 0s
  banking:
    # Moneda de las cuentas propias mientras no haya operación en otra divisa.
    base-currency: MXN
    # Los hechos de disbursement que enhebran la traza del dinero (ver PayoutTraceRecorder).
    # Configurables porque disbursement y stp nombran el despacho por variable de entorno
    # (DISBURSEMENT_STP_TOPIC / STP_INBOUND_TOPIC): si allá cambia, aquí tiene que cambiar igual.
    topics:
      payment-requested: ${BANKING_TOPIC_PAYMENT_REQUESTED:disbursement.stp-requested}
      disbursement-accepted: ${BANKING_TOPIC_DISBURSEMENT_ACCEPTED:disbursement.accepted}
