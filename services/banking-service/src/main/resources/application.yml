spring:
  application:
    name: banking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${SPRING_DATASOURCE_USERNAME:fintech}
    password: ${SPRING_DATASOURCE_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:banking-service}
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 30000

  liquibase:
    change-log: classpath:db/changelog/banking/db.changelog-banking.xml
    enabled: true

server:
  port: ${SERVER_PORT:8104}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

fintech:
  lock:
    enabled: true
    provider: redisson
    flavor: standard
    # La ventana en la que una petición repetida se descarta por ser la misma.
    default-ttl: 30s
    # Cero: el que no gana el candado pasa a la siguiente unidad en vez de bloquear un hilo.
    wait-time: 0s
  banking:
    # Moneda de las cuentas propias mientras no haya operación en otra divisa.
    base-currency: MXN
