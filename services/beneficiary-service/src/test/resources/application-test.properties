# Postgres real vía Testcontainers: es la única forma de que ddl-auto=validate pruebe algo, y de
# que los CHECK del changeset se ejerzan de verdad.
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///fintech
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/beneficiary/db.changelog-beneficiary.xml
spring.liquibase.default-schema=beneficiary
spring.liquibase.liquibase-schema=public

spring.kafka.bootstrap-servers=localhost:9092
spring.main.banner-mode=off
