spring:
  application:
    name: beneficiary-service

  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: ${POSTGRES_USER:fintech}
    password: ${POSTGRES_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: beneficiary
    open-in-view: false

  # La web de KYC sube el frente y el reverso de la INE en una sola petición. 8 MB por archivo
  # alcanza para una foto de teléfono sin comprimir; el tope de la petición es la suma de dos.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 17MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  liquibase:
    change-log: classpath:db/changelog/beneficiary/db.changelog-beneficiary.xml
    default-schema: beneficiary
    liquibase-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: beneficiary
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8102
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fintech:
  test-support:
    # Endpoints /internal/test-support/* — solo para pruebas E2E, deshabilitados por default.
    enabled: ${TEST_SUPPORT_ENABLED:false}
  beneficiary:
    # Vigencia de la liga de invitación. El diseño la fija en 7 días (L2066) y la promesa está
    # escrita en la pantalla 23, así que no es un parámetro que se toque a la ligera.
    invite-ttl-days: ${BENEFICIARY_INVITE_TTL_DAYS:7}
    # Sesión de invitado de la beneficiaria. Es la única credencial que llega a tener y sólo abre
    # este servicio.
    guest-session-ttl-minutes: ${BENEFICIARY_GUEST_SESSION_TTL_MINUTES:15}
    # Reenvíos de liga permitidos por colocación. Reenviar revoca la anterior y NO extiende la
    # ventana de 7 días: si extendiera, la vigencia sería infinita a punta de reenvíos.
    max-invite-resends: ${BENEFICIARY_MAX_INVITE_RESENDS:3}
    # Monto mínimo de una colocación — arranque del slider de la pantalla 22. La línea de distribuidora coloca
    # microcréditos: de $1,000 a $10,000 de $500 en $500, a 6–24 quincenas, al 95 % anual (catálogo, migración 023).
    min-placement-amount: ${BENEFICIARY_MIN_PLACEMENT_AMOUNT:1000}
    # Tope por beneficiario. No es el tamaño de la línea: acota cuánto puede darle a UNA persona,
    # para que quien tenga $500,000 no se los coloque completos a un solo cliente.
    max-placement-amount: ${BENEFICIARY_MAX_PLACEMENT_AMOUNT:10000}
    amount-step: ${BENEFICIARY_AMOUNT_STEP:500}
    term-fortnights: 12,14,16,18,20,22,24
    default-annual-rate: ${BENEFICIARY_ANNUAL_RATE:0.95}
    periods-per-year: 24
    # El IVA del interés va dentro del pago quincenal, como en el plan de cartera.
    vat-rate: ${BENEFICIARY_VAT_RATE:0.16}
    commission-on-time-rate: ${BENEFICIARY_COMMISSION_RATE:0.18}
    # ── Verificación de identidad ────────────────────────────────────────────
    # false = TODO lo revisa una persona. Es el estado vigente: no hay contrato con proveedor.
    # true  = el proveedor resuelve lo que cae dentro de sus umbrales y el analista sólo ve las
    #         excepciones. Encenderla sin adaptador **impide arrancar el servicio** a propósito:
    #         caer a manual en silencio escondería que la automatización que se cree tener no existe.
    identity-verification:
      # F3b · el modo YA NO se configura aquí.
      #
      # Manual o automático, y con qué proveedor, lo declara cada PRODUCTO en `Capabilities.kyc` del
      # catálogo, y llega por `product-catalog.product-activated`. Era una bandera del servicio y
      # eso obligaba a que todos los productos de un ambiente compartieran regla — una línea de
      # distribuidor y una tarjeta de uso propio no exigen lo mismo. Además, aflojar la
      # verificación dejaba de ser una decisión con autor y fecha para ser una variable de entorno.
      #
      # Lo que SÍ sigue aquí son los umbrales: calibran a un proveedor, no definen a un producto.
      # Mínimos para dar por buena una identidad sin intervención humana. Una métrica declarada
      # aquí que el proveedor no reporte cuenta como NO alcanzada: no saber no es aprobar.
      thresholds:
        facialMatch: ${BENEFICIARY_THRESHOLD_FACIAL:0.90}
        liveness: ${BENEFICIARY_THRESHOLD_LIVENESS:0.90}
        documentAuthenticity: ${BENEFICIARY_THRESHOLD_DOC:0.85}

    # ── KYC web público (fase 3) ──────────────────────────────────────────────
    # El OTP, su rate limit y la sesión de invitado viven en Postgres, no en Redis como decía el
    # plan: el servicio no tiene código de Redis y lo que se cuenta es evidencia auditable.
    public-kyc:
      # A dónde apunta la liga (?t=<token>). En local, el Vite de la página de KYC.
      link-base-url: ${BENEFICIARY_KYC_LINK_BASE_URL:http://localhost:4300/}
      # Código OTP fijo SÓLO PARA LOCAL. Vacío = códigos aleatorios. WhatsApp/SMS son noop aquí.
      dev-otp-code: ${BENEFICIARY_DEV_OTP_CODE:}
      otp-ttl-minutes: ${BENEFICIARY_OTP_TTL_MINUTES:5}
      # 3 envíos por cada 15 minutos por liga; 5 códigos equivocados congelan la liga 1 hora.
      max-otp-sends: ${BENEFICIARY_MAX_OTP_SENDS:3}
      otp-send-window-minutes: ${BENEFICIARY_OTP_SEND_WINDOW_MINUTES:15}
      max-otp-failures: ${BENEFICIARY_MAX_OTP_FAILURES:5}
      freeze-minutes: ${BENEFICIARY_OTP_FREEZE_MINUTES:60}

    # Sustituye la web pública de KYC mientras no exista. Apagado fuera de local.
    kyc-simulation-enabled: ${BENEFICIARY_KYC_SIMULATION_ENABLED:false}

    # Servicios que compone. Son URLs internas: la composición no sale a internet.
    credit-portfolio-service-url: ${CREDIT_PORTFOLIO_SERVICE_URL:http://localhost:8087}
    credit-product-service-url: ${CREDIT_PRODUCT_SERVICE_URL:http://localhost:8084}
    scoring-service-url: ${SCORING_SERVICE_URL:http://localhost:8082}
    wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8092}
    origination-service-url: ${ORIGINATION_SERVICE_URL:http://localhost:8081}
    party-service-url: ${PARTY_SERVICE_URL:http://localhost:8083}
