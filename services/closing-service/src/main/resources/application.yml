spring:
  application:
    name: closing-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${SPRING_DATASOURCE_USERNAME:fintech}
    password: ${SPRING_DATASOURCE_PASSWORD:fintech}
    driver-class-name: org.postgresql.Driver
    hikari:
      # El pool del cierre se dimensiona aparte y no se hereda: el barrido es la carga que hoy
      # compite con la API de cartera, y sacarlo de ahí es medio motivo de que este servicio exista.
      maximum-pool-size: ${DB_POOL_SIZE:8}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Grupo propio: si el cierre se atrasa, el lag es suyo y no toca a ningún consumidor operativo.
      group-id: ${KAFKA_GROUP_ID:closing-service}
      auto-offset-reset: earliest
    producer:
      # Sin estos dos, Kafka usa StringSerializer y cada evento (un record) revienta al enviarse:
      # la publicación fallaba siempre y las pruebas no lo veían porque sustituyen el publicador.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Los consumidores fijan su tipo local (USE_TYPE_INFO_HEADERS=false): la cabecera sólo filtraría
        # nombres de clases de este servicio.
        spring.json.add.type.headers: false
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 30000

  liquibase:
    change-log: classpath:db/changelog/closing/db.changelog-closing.xml
    enabled: true

server:
  port: ${SERVER_PORT:8103}
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

fintech:
  # Test support (shiftable business clock, among others). Off unless TEST_SUPPORT_ENABLED=true; never in production.
  test-support:
    enabled: ${TEST_SUPPORT_ENABLED:false}
  lock:
    enabled: true
    provider: redisson
    flavor: standard
    # La ventana en la que una petición repetida se descarta por ser la misma.
    default-ttl: 30s
    # Cero: el que no gana el candado pasa a la siguiente unidad en vez de bloquear un hilo.
    wait-time: 0s
  closing:
    calendar-code: MX
    # Where the portfolio lives: the cutoff copies its per-account day snapshot from here.
    portfolio-url: ${CREDIT_PORTFOLIO_SERVICE_URL:http://localhost:8087}
    portfolio-timeout: PT30S
    # Identidad del pod en el arrendamiento. En Kubernetes lo inyecta la downward API.
    node-id: ${HOSTNAME:local}
    batch-size: 500
    lease: 5m
    workers: 4
    # El corte repartido por cuenta. Ver ClosingProperties.Cutoff.
    cutoff:
      job-enabled: ${CLOSING_CUTOFF_JOB_ENABLED:true}
      # El disparo normal es credit-portfolio.day-closed. Este cron es la reanudación: corta, por las
      # mismas compuertas, lo que haya quedado esperando, y nunca un día que cartera no cerró.
      trigger-on-day-closed: true
      cron: ${CLOSING_CUTOFF_CRON:0 15/15 * * * *}
      # Cuánto espera en línea a que closing consuma los saldos de cartera antes de dejar el día en espera.
      gate-wait: PT10M
      gate-poll: PT2S
      movement-retention-days: 62
      # Techo de paralelismo entre todos los pods: Kafka da cada partición a un solo consumidor.
      partitions: ${CLOSING_CUTOFF_PARTITIONS:12}
      # Hilos consumidores por pod.
      concurrency: ${CLOSING_CUTOFF_CONCURRENCY:4}
      consumer-group: closing-cutoff-workers
      dispatch-page: 1000
      redispatch-after: 2m
      max-attempts: 3
      monitor-interval: ${CLOSING_CUTOFF_MONITOR_INTERVAL:PT15S}
      lookback-days: 31
      distributor-product-types: DISTRIBUTOR_LINE
      # Sólo las pruebas que corren el reloj cortan días que todavía no llegan.
      allow-future-dates: ${TEST_SUPPORT_ENABLED:false}
  scheduling:
    lock:
      table: closing.shedlock
