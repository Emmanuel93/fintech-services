  # ═══════════════════════════════════════════════════════════════════════════
  # Pagos salientes — servicios internos, sin exposición a internet.
  # Ninguno de los dos está publicado en el gateway: no reciben tráfico externo.
  # ═══════════════════════════════════════════════════════════════════════════

  disbursement-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: disbursement-service
    image: fintech/disbursement-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "disbursement-service"
      SPRING_APPLICATION_NAME: "disbursement-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BANKING_BASE_URL: http://banking-service:8080
      DISBURSEMENT_DISPATCH_ENABLED: ${DISBURSEMENT_DISPATCH_ENABLED:-true}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # Sin depends_on de disbursement-service: se hablan por topic, no por arranque.
  # Levantar uno solo tiene que funcionar — es parte de la prueba de desacople (DC-5).
  stp-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: stp-service
    image: fintech/stp-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "stp-service"
      SPRING_APPLICATION_NAME: "stp-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # stub en todo ambiente que no sea producción. Con perfil prod el stub NO arranca.
      STP_GATEWAY_MODE: ${STP_GATEWAY_MODE:-stub}
      STP_INBOUND_TOPIC: ${STP_INBOUND_TOPIC:-disbursement.stp-requested}
      STP_POLLING_ENABLED: ${STP_POLLING_ENABLED:-true}
      # ENFORCE | WARN | OFF — ver .env.example.
      STP_SIGNATURE_POLICY: ${STP_SIGNATURE_POLICY:-WARN}
      STP_CURRENT_KEK_ID: ${STP_CURRENT_KEK_ID:-local}
      # Material de la KEK. En producción va en el gestor de secretos y esta variable llega de
      # fuera; el default de abajo es SÓLO para el stack local y por eso está escrito a la vista:
      # un valor publicado en el repositorio no es un secreto y no pretende serlo.
      #
      # Sin default, el conector no podía guardar ninguna llave de firma y el carril del dinero
      # nunca podía completarse en local. El síntoma era una excepción al arrancar el sembrador
      # del stub, cuatro pagos parados en PENDING, y nada que dijera que faltaba una variable.
      # Mismo criterio que `JWT_SECRET` del configuration-service, que ya se resolvió así.
      STP_KEK_LOCAL: ${STP_KEK_LOCAL:-c3RhY2stbG9jYWwtbm8tZXMtdW4tc2VjcmV0byEhISE=}
      STP_ACCOUNT_HASH_SALT: ${STP_ACCOUNT_HASH_SALT:-cambiar-en-cada-ambiente}
      STP_BASE_URL: ${STP_BASE_URL:-https://demo.stpmex.com:7024/speiws/rest/}
      STP_CONSULTA_BASE_URL: ${STP_CONSULTA_BASE_URL:-https://efws-dev.stpmex.com/efws/API/}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # T7: Observability — agente OTel compartido (siempre activo, liviano)
  # ═══════════════════════════════════════════════════════════════════════════

  otel-agent-init:
    image: curlimages/curl:8.10.1
    user: "0:0"    # el volumen recién creado queda root-owned; el usuario default de esta imagen no puede escribir en él
    command: >
      -fsSL -o /otel/opentelemetry-javaagent.jar
      https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar
    volumes:
      - otel-agent-vol:/otel
    deploy:
      resources:
        limits:
          memory: 32M
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # T7: Observability — stack completo (opt-in: docker compose --profile observability up)
  # Ver docs/dominios/T7_observability.md para el diseño completo.
  # ═══════════════════════════════════════════════════════════════════════════

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./services/observability-service/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      - tempo
    profiles: ["observability"]
    networks:
      - fintech-network

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./services/observability-service/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    deploy:
      resources:
        limits:
          memory: 768M   # +256M sobre el base por el metrics_generator (service graph) — ver T7_observability.md
        reservations:
          memory: 384M
    profiles: ["observability"]
    networks:
      - fintech-network

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"      # recibe las métricas del service graph que genera Tempo
      - "--enable-feature=exemplar-storage"       # exemplars: salto métrica→traza (estilo Datadog)
    volumes:
      - ./services/observability-service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles: ["observability"]
    networks:
      - fintech-network

  fluent-bit:
    image: fluent/fluent-bit:3.2.2
    volumes:
      - ./services/observability-service/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./services/observability-service/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    depends_on:
      - elasticsearch
    profiles: ["observability"]
    networks:
      - fintech-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          memory: 1536M   # 512m de heap (ES_JAVA_OPTS) + margen para Lucene/off-heap — 1024M se quedó
                           # corto y ES murió por OOM (exit 137) al verificar el stack en vivo.
        reservations:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    profiles: ["observability"]
    networks:
      - fintech-network

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Permite HTML/SVG en paneles Text (mapa de dependencias con logos). Solo dev/localhost.
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      # Layout por capas (DAG) para el panel Node Graph en vez del layout de fuerzas por defecto —
      # con 20+ nodos (gateway -> BFF -> 19 servicios -> postgres/kafka/redis) el de fuerzas se
      # enreda; el de capas respeta la dirección real de las llamadas.
      GF_FEATURE_TOGGLES_ENABLE: "nodeGraphDotLayout"
    volumes:
      - ./services/observability-service/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/observability-service/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      - prometheus
      - tempo
      - elasticsearch
    profiles: ["observability"]
    networks:
      - fintech-network

volumes:
  pgdata:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  redis_data:
  otel-agent-vol:
  esdata:
  prometheus_data:
  tempo_data:
  grafana_data:

networks:
  fintech-network:
    driver: bridge
