  payments-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payments-service
    image: fintech/payments-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "payments-service"
      SPRING_APPLICATION_NAME: "payments-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      credit-portfolio-service:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # CHANNEL — Mobile BFF
  # Nota: corre en puerto 8085 internamente (SERVER_PORT: 8085)
  # ═══════════════════════════════════════════════════════════════════════════

  channel-mobile-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: channel-mobile-service
    image: fintech/channel-mobile-service:latest
    # Sin puerto externo — acceso solo a través del gateway en /mobile/*
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "channel-mobile-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      IDENTITY_SERVICE_URL: http://identity-service:8080
      ORIGINATION_SERVICE_URL: http://origination-service:8080
      PARTY_SERVICE_URL: http://party-service:8080
      CREDIT_PORTFOLIO_SERVICE_URL: http://credit-portfolio-service:8080
      WALLET_SERVICE_URL: http://wallet-service:8080
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8080
      PAYMENTS_SERVICE_URL: http://payments-service:8080
      CHARGES_SERVICE_URL: http://charges-service:8080
      SCORING_SERVICE_URL: http://scoring-service:8080
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8080
      # Sustituye la web pública de KYC de la beneficiaria mientras no exista. Sólo local.
      BENEFICIARY_KYC_SIMULATION_ENABLED: "true"
      TEST_SUPPORT_ENABLED: ${TEST_SUPPORT_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      OTP_MAX_SENDS_PER_WINDOW: ${OTP_MAX_SENDS_PER_WINDOW:-5}
      OTP_SEND_WINDOW_MINUTES: ${OTP_SEND_WINDOW_MINUTES:-60}
      KYC_SESSION_EXPIRY_MINUTES: ${KYC_SESSION_EXPIRY_MINUTES:-30}
      OTP_CODE_VALIDATION: ${OTP_CODE_VALIDATION:-true}
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
    <<: *app-mem
    depends_on:
      identity-service:
        condition: service_started
      origination-service:
        condition: service_started
      wallet-service:
        condition: service_started
      notifications-service:
        condition: service_started
      payments-service:
        condition: service_started
      scoring-service:
        condition: service_started
      redis:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # BFF BACKOFFICE — consola operativa de crédito
  # Sin puerto externo: solo se llega por el gateway en backoffice.localhost, que
  # exige el claim channel=BACKOFFICE. Stateless, sin base de datos propia.
  # ═══════════════════════════════════════════════════════════════════════════

  channel-backoffice-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: channel-backoffice-service
    image: fintech/channel-backoffice-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "channel-backoffice-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8099
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PARTY_SERVICE_URL: http://party-service:8080
      CREDIT_PORTFOLIO_SERVICE_URL: http://credit-portfolio-service:8080
      CREDIT_PRODUCT_SERVICE_URL: http://credit-product-service:8080
      ORIGINATION_SERVICE_URL: http://origination-service:8080
      SCORING_SERVICE_URL: http://scoring-service:8080
      RISK_SERVICE_URL: http://risk-service:8080
      COLLECTIONS_SERVICE_URL: http://collections-service:8080
      COMMISSION_SERVICE_URL: http://commission-service:8080
      CONFIGURATION_SERVICE_URL: http://configuration-service:8080
      PAYMENTS_SERVICE_URL: http://payments-service:8080
      CHARGES_SERVICE_URL: http://charges-service:8080
      WALLET_SERVICE_URL: http://wallet-service:8080
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8080
      ACCOUNTING_SERVICE_URL: http://accounting-service:8080
      INVOICING_SERVICE_URL: http://invoicing-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      SALES_ORG_SERVICE_URL: http://sales-org-service:8080
      # La bandeja de colocaciones del backoffice vive en beneficiary-service. Sin esta línea
      # el cliente cae a su default de bootRun (localhost:8102), que dentro del contenedor es
      # el propio backoffice: la bandeja respondería 404 sin decir por qué.
      BENEFICIARY_SERVICE_URL: http://beneficiary-service:8080
      # Credencial propia del canal contra identity, para que la bitácora resuelva quién actuó sin
      # depender de los permisos del que actúa. Sembrada en identity:013 — rotar antes de exponer.
      IDENTITY_SERVICE_CLIENT_ID: channel-backoffice-service
      IDENTITY_SERVICE_CLIENT_SECRET: ${IDENTITY_SERVICE_CLIENT_SECRET:-Backoffice-Audit#2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    <<: *app-mem
    depends_on:
      identity-service:
        condition: service_started
      party-service:
        condition: service_started
      credit-portfolio-service:
        condition: service_started
      credit-product-service:
        condition: service_started
      redis:
        condition: service_healthy
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

