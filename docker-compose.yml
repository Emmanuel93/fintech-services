# ═══════════════════════════════════════════════════════════════════════════
# Presupuesto de memoria (T7 Observability, 2026-07-18)
# Host de referencia: 24 GB. Docker Desktop → Settings → Resources → Memory
# se recomienda fijar en 16 GB (deja 8 GB de reserva para el host/OS, tal como
# se pidió explícitamente) — hoy Docker Desktop tiene 7.65 GB asignados, que
# alcanza para el stack de negocio solo pero NO alcanza si además se prende
# el perfil `observability` simultáneamente (ver cálculo abajo). Este archivo
# no puede cambiar la asignación de RAM del propio Docker Desktop (es config
# de la app, no del repo) — sí fija un límite duro por contenedor para que la
# suma total, aun en el peor caso (todo prendido a la vez), quede acotada:
#
#   19 servicios Java × 512M          ≈  9.50 GB
#   gateway (nginx, liviano)          ≈  0.06 GB
#   postgres + kafka + zookeeper + redis ≈ 2.38 GB
#   perfil observability (6 contenedores, opt-in) ≈ 3.13 GB (elasticsearch subido a 1536M
#                                                             tras un OOM-kill real en verificación)
#   ─────────────────────────────────────────────
#   TOTAL peor caso                   ≈ 15.1 GB   (holgura de ~0.9 GB dentro de 16 GB)
#
# `docker compose up` (sin --profile observability) usa ≈ 12 GB peor caso.
# Nota: estos son LÍMITES (techos), no reservas — el uso real observado en verificación con
# los 19 servicios + infra + observability corriendo en simultáneo fue de ~5-6 GB reales.
# ═══════════════════════════════════════════════════════════════════════════

x-otel-agent: &otel-agent
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  # El collector sólo existe con `--profile observability`. Con el exportador
  # fijo en otlp, cada request de una corrida normal escupe
  # `UnknownHostException: otel-collector` — ruido que enmascara los errores
  # que sí importan. Se apaga por default y se enciende junto con el perfil:
  #   OTEL_TRACES_EXPORTER=otlp docker compose --profile observability up -d
  OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-none}"
  OTEL_METRICS_EXPORTER: "none"    # métricas van por Micrometer/Prometheus — ver T7_observability.md OBS-01
  OTEL_LOGS_EXPORTER: "none"       # logs van por Fluent Bit — ver T7_observability.md OBS-01
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=fintech,deployment.environment=docker-compose"
  # Profundidad de traza: el agente desactiva por defecto el span del @Controller y del @KafkaListener.
  # Los reactivamos para ver la cadena controller → (use-case vía @WithSpan) → repo/JPA/Kafka.
  OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED: "true"
  OTEL_INSTRUMENTATION_SPRING_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
  OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"

x-app-mem: &app-mem
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # INFRAESTRUCTURA (siempre activa)
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    # max_connections default (100) no alcanza cuando los 19 servicios arrancan a la vez —
    # cada uno abre su propio pool HikariCP (~10 conexiones) + Liquibase — hallazgo real al
    # verificar el stack completo en vivo (2026-07-18), no relacionado con T7 en sí.
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"    # expuesto para herramientas de desarrollo (DBeaver, psql)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fintech-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - fintech-network

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - fintech-network

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"       # expuesto para herramientas de desarrollo (redis-cli)
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # GATEWAY — único punto de entrada externo
  # Puerto host: GATEWAY_PORT (default 8080).
  # Acceso externo: http://localhost:8080  (o mobile.localhost:8080 con /etc/hosts)
  # Acceso interno (Docker): http://<service-name>:8080 (sin pasar por gateway)
  # ═══════════════════════════════════════════════════════════════════════════

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    image: fintech/gateway-service:latest
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./services/gateway-service/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      # Los límites de tasa por entorno: por default los de producción. En local
      # se apunta a rate-limits.local.conf desde el .env, porque 3 registros por
      # minuto hacen fallar la suite E2E por el gateway y no por el producto.
      - ./services/gateway-service/${GATEWAY_RATE_LIMITS:-rate-limits.conf}:/etc/nginx/rate-limits.conf:ro
      - ./services/gateway-service/conf.d:/etc/nginx/conf.d:ro
      - ./services/gateway-service/keys:/etc/nginx/keys:ro
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    depends_on:
      # nginx resuelve los upstreams al cargar la config: si un BFF no existe todavía,
      # el gateway arranca en bucle de reinicio hasta que aparezca.
      - identity-service
      - channel-mobile-service
      - channel-backoffice-service
    restart: unless-stopped
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # TRANSVERSALES (T1 Identity, T5 Configuration)
  # ═══════════════════════════════════════════════════════════════════════════

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: identity-service
    image: fintech/identity-service:latest
    # Sin puerto externo — acceso solo a través del gateway
    volumes:
      - ./services/identity-service/src/main/resources/keys/private.pem:/etc/identity/keys/private.pem:ro
      - ./services/gateway-service/keys/public.pem:/etc/identity/keys/public.pem:ro
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "identity-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      AUTH_PRIVATE_KEY_PATH: /etc/identity/keys/private.pem
      AUTH_PUBLIC_KEY_PATH: /etc/identity/keys/public.pem
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  configuration-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: configuration-service
    image: fintech/configuration-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "configuration-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-QGISPRfzivPfc8A8cil1RIpRDWl0zsrGuHdPBT0NkxWOYWhJb0bPQRN6yQOFU}
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CONFIG_CACHE_TTL_SECONDS: ${CONFIG_CACHE_TTL_SECONDS:-300}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE — Party, Scoring, Credit Product
  # ═══════════════════════════════════════════════════════════════════════════

  party-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: party-service
    image: fintech/party-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "party-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  scoring-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scoring-service
    image: fintech/scoring-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "scoring-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CIRCULO_CREDITO_API_KEY: ${CIRCULO_CREDITO_API_KEY:-YfuKKDGcx8DBFLny8gWJVaBcx0xUc5oT}
      # Dev/local: usa el mock de buró (reporte determinista por CURP) para correr el journey
      # sin depender del sandbox externo. Poner en false para pegar al buró real.
      SCORING_CIRCULO_MOCK_ENABLED: ${SCORING_CIRCULO_MOCK_ENABLED:-true}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  credit-product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: credit-product-service
    image: fintech/credit-product-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "credit-product-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # ═══════════════════════════════════════════════════════════════════════════
  # CORE — Origination (D3) + Credit Portfolio ★ (D4)
  # ═══════════════════════════════════════════════════════════════════════════

  origination-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: origination-service
    image: fintech/origination-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "origination-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CREDIT_PRODUCT_SERVICE_URL: http://credit-product-service:8080
      PARTY_SERVICE_URL: http://party-service:8080
      SALES_ORG_SERVICE_URL: http://sales-org-service:8080
      # Habilita /internal/test-support/* (llevar una solicitud a revisión sin
      # depender del score). Apagado fuera de local.
      TEST_SUPPORT_ENABLED: ${TEST_SUPPORT_ENABLED:-false}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      identity-service:
        condition: service_started
      credit-product-service:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  credit-portfolio-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: credit-portfolio-service
    image: fintech/credit-portfolio-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "credit-portfolio-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TEST_SUPPORT_ENABLED: ${TEST_SUPPORT_ENABLED:-false}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  # ─────────────────────────────────────────────────────────────────────────────
  # D14: Closing & Cutoff — motor de cierres, cortes y conciliación a tres puntas.
  # Deployment aparte a propósito: el barrido de todas las cuentas no debe compartir
  # JVM ni pool con la API de cartera, que es lo que hoy lo hace competir con el backoffice.
  # ─────────────────────────────────────────────────────────────────────────────
  banking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: banking-service
    image: fintech/banking-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "banking-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    ports:
      - "${BANKING_PORT:-8104}:8080"
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  closing-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: closing-service
    image: fintech/closing-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "closing-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      # Identidad del pod en el arrendamiento del candado. Con `docker compose up --scale`,
      # cada réplica trae la suya y el reparto se reparte de verdad.
      HOSTNAME: ${HOSTNAME:-closing-1}
    ports:
      - "${CLOSING_PORT:-8103}:8080"
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - fintech-network

  charges-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: charges-service
    image: fintech/charges-service:latest
    volumes:
      - otel-agent-vol:/otel:ro
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: "charges-service"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      POSTGRES_USER: ${POSTGRES_USER:-fintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TEST_SUPPORT_ENABLED: ${TEST_SUPPORT_ENABLED:-false}
    <<: *app-mem
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      credit-portfolio-service:
        condition: service_started
      otel-agent-init:
        condition: service_completed_successfully
    restart: on-failure
