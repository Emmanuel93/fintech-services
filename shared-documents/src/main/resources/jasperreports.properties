# Las expresiones de las plantillas se compilan con JDT (Eclipse), que viaja dentro del jar.
# Sin esto Jasper usa el compilador del JDK si lo encuentra —en las pruebas sí, en la imagen (JRE) no—
# y la diferencia sólo aparece cuando el pod no arranca.
net.sf.jasperreports.compiler.java=net.sf.jasperreports.jdt.JRJdtCompiler
# Si alguien edita una plantilla con una fuente que no está empaquetada, que falle claro y no en silencio.
net.sf.jasperreports.awt.ignore.missing.font=false
